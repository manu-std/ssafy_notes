<title>Django 단원별 CBT</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: CBT 시험장 — 상단 상태바, 왼쪽 문제지, 오른쪽 OMR 답안표기란(폰에서는 하단 시트) */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f5f7f9; --ink: #16202a; --muted: #5a6674; --line: #d5dce3;
  --accent: #1f5f99; --accent-ink: #ffffff; --accent-soft: #e2ecf6;
  --omr: #c23d5d; --omr-soft: #fbe9ee;
  --ok: #1d7a4b; --ok-soft: #e1f2e8; --bad: #c0392f; --bad-soft: #fbe6e4;
  --code: #f2f4f7;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "D2Coding", Consolas, monospace;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Malgun Gothic", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151b; --surface: #18202a; --surface-2: #1e2731; --ink: #e5ebf1; --muted: #9ba8b6; --line: #2d3946;
  --accent: #6ba8e4; --accent-ink: #0c1621; --accent-soft: #1c2f42;
  --omr: #e47c95; --omr-soft: #3a2029;
  --ok: #4cc38a; --ok-soft: #163325; --bad: #f07b71; --bad-soft: #3b1e1b;
  --code: #131a21; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #10151b; --surface: #18202a; --surface-2: #1e2731; --ink: #e5ebf1; --muted: #9ba8b6; --line: #2d3946;
  --accent: #6ba8e4; --accent-ink: #0c1621; --accent-soft: #1c2f42;
  --omr: #e47c95; --omr-soft: #3a2029;
  --ok: #4cc38a; --ok-soft: #163325; --bad: #f07b71; --bad-soft: #3b1e1b;
  --code: #131a21; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible + .chip, .chip:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font-family: var(--f-mono); font-size: .9em; background: var(--code); border: 1px solid var(--line); border-radius: 4px; padding: 0 .3em; overflow-wrap: anywhere; }
pre { margin: .6rem 0; background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: .75rem .9rem; overflow-x: auto; }
pre code { background: none; border: 0; padding: 0; font-size: .86rem; line-height: 1.55; white-space: pre; overflow-wrap: normal; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: .55rem 1rem; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.label { font-size: .75rem; letter-spacing: .06em; color: var(--muted); font-weight: 500; }
.tnum { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- 시작 화면 ---------- */
#setup .wrap { padding-block: 28px 48px; display: grid; gap: 22px; }
.mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mast h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 2.8rem); line-height: 1.05; letter-spacing: .01em; }
.mast h1 span { color: var(--omr); }
.mast p { margin: .35rem 0 0; color: var(--muted); max-width: 60ch; }
.keynote { font-size: .8rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; padding: .45rem .7rem; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; font-size: 1rem; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
.chip { position: relative; display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; cursor: pointer; background: var(--surface-2); min-width: 0; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip .no { font-family: var(--f-mono); font-weight: 500; color: var(--muted); }
.chip .nm { flex: 1; min-width: 0; font-size: .92rem; line-height: 1.35; }
.chip .ct { font-size: .75rem; color: var(--muted); }
.chip .box { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--omr); flex: none; }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.chip.on .box { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 3px var(--accent-soft); }
.opts-row { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: .5rem .9rem; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg-help { font-size: .82rem; color: var(--muted); }
.toggle { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.toggle input { accent-color: var(--accent); width: 16px; height: 16px; }
.start-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.start-row .btn-primary { padding: .75rem 1.4rem; font-size: 1rem; }

/* ---------- 시험 화면 ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.bar .ttl { font-weight: 700; white-space: nowrap; }
.pill { font-size: .72rem; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 0 .55rem; white-space: nowrap; }
.prog { flex: 1; min-width: 60px; display: grid; gap: 4px; }
.prog .meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); gap: 8px; }
.prog .track { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.prog .fill { height: 100%; background: var(--accent); width: 0; transition: width .2s; }
.exam-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 20px; align-items: start; padding-block: 20px 40px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px 22px 18px; min-width: 0; }
.qtop { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin-bottom: 6px; }
.qno { font-family: var(--f-display); font-size: 1.9rem; line-height: 1; color: var(--accent); }
.qunit { font-size: .8rem; color: var(--muted); }
.stem { font-size: 1.06rem; margin: .4rem 0 1rem; }
.stem p { margin: 0 0 .4rem; text-wrap: pretty; }
.choices { display: grid; gap: 8px; }
.opt { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: .75rem .85rem; cursor: pointer; line-height: 1.5; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .bn { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 2px solid var(--omr); display: grid; place-items: center; font-family: var(--f-mono); font-size: .85rem; font-weight: 500; color: var(--omr); margin-top: .05rem; }
.opt .tx { min-width: 0; overflow-wrap: anywhere; }
.opt.picked { border-color: var(--ink); background: var(--surface); }
.opt.picked .bn { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .bn { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bn { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt:disabled { cursor: default; }
.explain { margin-top: 14px; border-left: 3px solid var(--ok); background: var(--surface-2); border-radius: 0 8px 8px 0; padding: .7rem .9rem; font-size: .93rem; }
.explain.bad { border-left-color: var(--bad); }
.explain b { display: block; margin-bottom: .15rem; }
.qnav { display: flex; gap: 8px; justify-content: space-between; margin-top: 18px; }
.qnav .grow { flex: 1; }
.kbd-hint { font-size: .75rem; color: var(--muted); margin-top: 10px; }
.confirm { margin-top: 14px; border: 1px solid var(--omr); background: var(--omr-soft); border-radius: 8px; padding: .8rem .9rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.confirm p { margin: 0; flex: 1; min-width: 180px; }

.omr { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; max-height: calc(100vh - 100px); }
.omr-head { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; border-bottom: 2px solid var(--omr); }
.omr-head h3 { margin: 0; font-size: .9rem; color: var(--omr); letter-spacing: .08em; }
.omr-head .left { font-size: .78rem; color: var(--muted); }
.omr-close { display: none; }
.omr-body { overflow-y: auto; padding: 6px 8px 10px; }
.orow { display: flex; align-items: center; gap: 4px; padding: 2px 4px; border-radius: 6px; }
.orow.cur { background: var(--accent-soft); }
.orow .on { width: 2.4rem; text-align: right; padding-right: 6px; border: 0; background: none; cursor: pointer; font-family: var(--f-mono); font-size: .8rem; color: var(--muted); }
.orow.cur .on { color: var(--accent); font-weight: 500; }
.bub { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--omr); background: none; color: var(--omr); font-family: var(--f-mono); font-size: .72rem; cursor: pointer; padding: 0; display: grid; place-items: center; }
.bub.f { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.bub.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.bub.no { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.bub.ans { box-shadow: 0 0 0 2px var(--ok); }
.unit-sep { font-size: .72rem; color: var(--muted); padding: 8px 6px 2px; }
.dock { display: none; }

/* ---------- 결과 화면 ---------- */
#result .wrap { padding-block: 28px 56px; display: grid; gap: 18px; }
.score { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; }
.score .big { font-family: var(--f-display); font-size: clamp(3.4rem, 12vw, 5rem); line-height: .95; color: var(--accent); }
.score .big small { font-size: .4em; color: var(--muted); margin-left: .15em; }
.score .sub { display: grid; gap: 4px; }
.score .sub strong { font-size: 1.1rem; }
.verdict { display: inline-block; font-size: .8rem; font-weight: 700; border-radius: 6px; padding: .1rem .5rem; width: fit-content; }
.verdict.pass { background: var(--ok-soft); color: var(--ok); }
.verdict.fail { background: var(--bad-soft); color: var(--bad); }
.utable { width: 100%; border-collapse: collapse; font-size: .9rem; }
.utable th, .utable td { text-align: left; padding: .5rem .4rem; border-bottom: 1px solid var(--line); }
.utable th { font-size: .75rem; color: var(--muted); font-weight: 500; }
.utable td.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; min-width: 70px; }
.mini i { display: block; height: 100%; background: var(--ok); }
.mini i.low { background: var(--bad); }
.tablebox { overflow-x: auto; }
.review { display: grid; gap: 12px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.ritem.bad { border-left: 4px solid var(--bad); }
.ritem.good { border-left: 4px solid var(--ok); }
.ritem .rhead { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: .82rem; color: var(--muted); margin-bottom: 4px; }
.ritem .rhead b { color: var(--ink); font-size: .95rem; }
.ritem .stem { font-size: .98rem; margin-bottom: .6rem; }
.ritem .opt { padding: .5rem .7rem; font-size: .92rem; }
.tag { font-size: .7rem; border-radius: 4px; padding: 0 .35rem; margin-left: .3rem; font-weight: 700; white-space: nowrap; }
.tag.mine { background: var(--bad-soft); color: var(--bad); }
.tag.right { background: var(--ok-soft); color: var(--ok); }
.tag.trap { background: var(--omr-soft); color: var(--omr); margin-left: 0; }
.empty { color: var(--muted); text-align: center; padding: 24px; }
.export-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.export-row .seg-help { display: block; }
.export-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.export-msg { margin: 8px 0 0; font-size: .85rem; color: var(--muted); }
.export-msg:empty { display: none; }
.export-fb { width: 100%; min-height: 180px; margin-top: 8px; font-family: var(--f-mono); font-size: .8rem; background: var(--code); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: .6rem; resize: vertical; }

/* ---------- 폰 ---------- */
@media (max-width: 899px) {
  .exam-grid { grid-template-columns: minmax(0, 1fr); padding-block: 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .qcard { padding: 16px 14px 14px; }
  .bar .ttl { display: none; }
  .qnav.desk { display: none; }
  .kbd-hint { display: none; }
  .omr { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; top: auto; max-height: 72vh; border-radius: 14px 14px 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); transform: translateY(105%); transition: transform .22s ease; box-shadow: 0 -8px 30px rgb(0 0 0 / .18); }
  .omr.open { transform: none; }
  .omr-close { display: inline-block; }
  .scrim { position: fixed; inset: 0; z-index: 35; background: rgb(0 0 0 / .35); }
  .dock { display: flex; position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; gap: 8px; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  .dock .btn { flex: 1; padding: .7rem .4rem; }
  .score { grid-template-columns: 1fr; gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <section id="setup">
    <div class="wrap">
      <div class="mast">
        <div>
          <h1>Django <span>CBT</span></h1>
          <p>SSAFY Django 1~10단원, 단원당 30문항(기본 20 + 헷갈리기 쉬운 함정 10). 단원을 골라 시험처럼 끝까지 풀고 채점하거나, 한 문제씩 바로 정답을 확인하며 풀 수 있다.</p>
        </div>
        <div class="keynote" id="keynote"></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>단원 선택</h2>
          <div style="display:flex;gap:6px">
            <button class="btn" id="selAll" type="button">전체 선택</button>
            <button class="btn" id="selNone" type="button">선택 해제</button>
          </div>
        </div>
        <div class="units" id="units"></div>
      </div>

      <div class="panel" style="display:grid;gap:14px">
        <div class="opts-row">
          <div class="seg" role="group" aria-label="풀이 방식">
            <button type="button" id="modeExam" aria-pressed="true">시험 모드</button>
            <button type="button" id="modePractice" aria-pressed="false">연습 모드</button>
          </div>
          <span class="seg-help" id="modeHelp"></span>
        </div>
        <div class="opts-row">
          <div class="seg" role="group" aria-label="문항 범위">
            <button type="button" id="scAll" aria-pressed="true">전체 30</button>
            <button type="button" id="scBasic" aria-pressed="false">기본 1~20</button>
            <button type="button" id="scTrap" aria-pressed="false">함정 21~30</button>
          </div>
          <span class="seg-help">함정 = 헷갈리는 쌍·코드 실수·뒤바꾼 개념만 모은 문항</span>
        </div>
        <label class="toggle"><input type="checkbox" id="shuffle"> 문제 순서 섞기 <span class="seg-help">(보기 순서는 고정 — 정답 위치는 단원마다 ①~④ 균등 배치)</span></label>
        <div class="start-row">
          <button class="btn btn-primary" id="startBtn" type="button">시작</button>
          <button class="btn" id="retryStored" type="button" hidden>지난 오답 다시 풀기</button>
          <button class="btn" id="saveStored" type="button" hidden>누적 오답노트 저장</button>
          <button class="btn" id="copyStored" type="button" hidden>누적 오답 복사</button>
          <button class="btn" id="clearStored" type="button" hidden>오답 기록 지우기</button>
        </div>
        <p class="export-msg" id="storedMsg" role="status"></p>
        <textarea id="storedFallback" class="export-fb" readonly hidden aria-label="누적 오답노트 마크다운"></textarea>
      </div>
    </div>
  </section>

  <section id="exam" hidden>
    <header class="bar">
      <div class="wrap">
        <span class="ttl">Django CBT</span>
        <span class="pill" id="modePill"></span>
        <div class="prog">
          <div class="meta"><span id="progText" class="tnum"></span><span id="answeredText" class="tnum"></span></div>
          <div class="track"><div class="fill" id="progFill"></div></div>
        </div>
        <span class="tnum" id="timer" aria-label="경과 시간">00:00</span>
        <button class="btn btn-primary" id="submitBtn" type="button">제출</button>
      </div>
    </header>
    <div class="wrap exam-grid">
      <main class="qcard" id="qcard">
        <div class="qtop"><span class="qno tnum" id="qno"></span><span class="qunit" id="qunit"></span></div>
        <div class="stem" id="stem"></div>
        <div class="choices" id="choices"></div>
        <div id="explainBox"></div>
        <div id="confirmBox"></div>
        <div class="qnav desk">
          <button class="btn" id="prevBtn" type="button">← 이전</button>
          <span class="grow"></span>
          <button class="btn" id="nextBtn" type="button">다음 →</button>
        </div>
        <div class="kbd-hint">키보드: 1~4 보기 선택 · ← → 이동 · Enter 다음 문제</div>
      </main>
      <aside class="omr" id="omr" aria-label="답안표기란">
        <div class="omr-head">
          <h3>답안표기란</h3>
          <span class="left tnum" id="omrLeft"></span>
          <button class="btn omr-close" id="omrClose" type="button">닫기</button>
        </div>
        <div class="omr-body" id="omrBody"></div>
      </aside>
    </div>
    <div class="scrim" id="scrim" hidden></div>
    <nav class="dock" aria-label="문제 이동">
      <button class="btn" id="mPrev" type="button">← 이전</button>
      <button class="btn" id="mSheet" type="button">답안표</button>
      <button class="btn btn-primary" id="mNext" type="button">다음 →</button>
    </nav>
  </section>

  <section id="result" hidden>
    <div class="wrap">
      <div class="panel score">
        <div class="big tnum" id="scoreBig"></div>
        <div class="sub">
          <span class="verdict" id="verdict"></span>
          <strong id="scoreLine"></strong>
          <span class="seg-help" id="scoreMeta"></span>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head"><h2>단원별 결과</h2></div>
        <div class="tablebox"><table class="utable" id="utable"></table></div>
      </div>
      <div class="panel" id="exportPanel">
        <div class="export-row">
          <div><strong>오답노트 내보내기</strong><span class="seg-help" id="exportInfo"></span></div>
          <div class="export-btns">
            <button class="btn" id="saveWrong" type="button" hidden>.md 파일로 저장</button>
            <button class="btn" id="copyWrong" type="button">마크다운 복사</button>
          </div>
        </div>
        <p class="export-msg" id="exportMsg" role="status"></p>
        <textarea id="exportFallback" class="export-fb" readonly hidden aria-label="오답노트 마크다운"></textarea>
      </div>
      <div class="panel-head" style="margin:0">
        <div class="seg" role="group" aria-label="문제 보기">
          <button type="button" id="fWrong" aria-pressed="true">틀린 문제</button>
          <button type="button" id="fAll" aria-pressed="false">전체</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary" id="retryWrong" type="button">틀린 문제 다시 풀기</button>
          <button class="btn" id="toSetup" type="button">처음으로</button>
        </div>
      </div>
      <div class="review" id="review"></div>
    </div>
  </section>
</div>

<script type="application/json" id="bank">__BANK_JSON__</script>
<script>
(() => {
  const BANK = JSON.parse(document.getElementById('bank').textContent);
  const CIRC = ['①', '②', '③', '④'];
  const Q = {}, UNIT = {}, UNIT_IDS = [];
  for (const u of BANK.units) {
    UNIT[u.id] = u; UNIT_IDS.push(u.id);
    for (const q of u.questions) {
      const id = u.id + '-' + String(q.n).padStart(2, '0');
      Q[id] = { ...q, id, unit: u.id };
    }
  }
  const $ = (s) => document.querySelector(s);
  const LS = 'django-cbt:v1';
  const store = {
    read() { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } },
    write(v) { try { localStorage.setItem(LS, JSON.stringify(v)); } catch {} },
  };

  let S = {
    screen: 'setup', mode: 'exam', shuffle: false, sel: ['01'], scope: 'all',
    order: [], ans: {}, rev: {}, cur: 0, t0: 0, elapsed: 0, filter: 'wrong', confirm: false, sheet: false,
  };

  // ---------- 텍스트 렌더링 (```코드```, `인라인`, **굵게**) ----------
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function inline(s) {
    return s.split(/(`[^`]+`)/).map((p) =>
      p.startsWith('`') && p.endsWith('`') && p.length > 1
        ? '<code>' + esc(p.slice(1, -1)) + '</code>'
        : esc(p).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    ).join('');
  }
  function block(s) {
    const out = []; const re = /```[\w-]*\n([\s\S]*?)\n?```/g; let last = 0, m;
    while ((m = re.exec(s))) {
      const txt = s.slice(last, m.index).trim();
      if (txt) out.push('<p>' + txt.split('\n').map(inline).join('<br>') + '</p>');
      out.push('<pre><code>' + esc(m[1]) + '</code></pre>');
      last = re.lastIndex;
    }
    const tail = s.slice(last).trim();
    if (tail) out.push('<p>' + tail.split('\n').map(inline).join('<br>') + '</p>');
    return out.join('');
  }
  const unitLabel = (id) => id + '단원 · ' + UNIT[id].title;
  const inScope = (q) => S.scope === 'all' || (S.scope === 'trap' ? q.trap : !q.trap);
  const scopedIds = (u) => UNIT[u].questions.filter(inScope).map((q) => u + '-' + String(q.n).padStart(2, '0'));
  const trapTag = (q) => q.trap ? ' <span class="tag trap">함정</span>' : '';
  const fmt = (sec) => { const m = Math.floor(sec / 60), s = sec % 60; return (m >= 60 ? Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(s).padStart(2, '0'); };

  function show(screen) {
    S.screen = screen;
    for (const id of ['setup', 'exam', 'result']) document.getElementById(id).hidden = id !== screen;
    window.scrollTo(0, 0);
  }

  // ---------- 시작 화면 ----------
  function renderSetup() {
    $('#keynote').innerHTML = '정답 위치 시드 <span class="tnum">' + BANK.seed + ' · ' + BANK.seed2 + '</span><br>①②③④ 각 75개, 문제보다 먼저 배정';
    $('#units').innerHTML = BANK.units.map((u) => {
      const on = S.sel.includes(u.id);
      return `<label class="chip${on ? ' on' : ''}"><input type="checkbox" value="${u.id}"${on ? ' checked' : ''}>
        <span class="box" aria-hidden="true"></span><span class="no">${u.id}</span>
        <span class="nm">${esc(u.title)}</span><span class="ct">${scopedIds(u.id).length}문항</span></label>`;
    }).join('');
    $('#scAll').setAttribute('aria-pressed', S.scope === 'all');
    $('#scBasic').setAttribute('aria-pressed', S.scope === 'basic');
    $('#scTrap').setAttribute('aria-pressed', S.scope === 'trap');
    $('#modeExam').setAttribute('aria-pressed', S.mode === 'exam');
    $('#modePractice').setAttribute('aria-pressed', S.mode === 'practice');
    $('#modeHelp').textContent = S.mode === 'exam' ? '끝까지 풀고 제출하면 한 번에 채점' : '보기를 고르면 바로 정답과 해설 표시';
    $('#shuffle').checked = S.shuffle;
    const n = S.sel.reduce((a, id) => a + scopedIds(id).length, 0);
    $('#startBtn').textContent = n ? `${n}문항 시작` : '단원을 골라 주세요';
    $('#startBtn').disabled = !n;
    const wrong = (store.read().wrong || []).filter((id) => Q[id]);
    $('#retryStored').hidden = !wrong.length;
    $('#clearStored').hidden = !wrong.length;
    $('#saveStored').hidden = !wrong.length || !DL;
    $('#copyStored').hidden = !wrong.length;
    if (!wrong.length) { $('#storedMsg').textContent = ''; $('#storedFallback').hidden = true; }
    $('#retryStored').textContent = `지난 오답 ${wrong.length}문항 다시 풀기`;
  }
  $('#units').addEventListener('change', (e) => {
    const v = e.target.value; if (!v) return;
    S.sel = e.target.checked ? [...new Set([...S.sel, v])].sort() : S.sel.filter((x) => x !== v);
    savePrefs(); renderSetup();
  });
  $('#selAll').onclick = () => { S.sel = [...UNIT_IDS]; savePrefs(); renderSetup(); };
  $('#selNone').onclick = () => { S.sel = []; savePrefs(); renderSetup(); };
  $('#modeExam').onclick = () => { S.mode = 'exam'; savePrefs(); renderSetup(); };
  $('#modePractice').onclick = () => { S.mode = 'practice'; savePrefs(); renderSetup(); };
  $('#shuffle').onchange = (e) => { S.shuffle = e.target.checked; savePrefs(); };
  $('#scAll').onclick = () => { S.scope = 'all'; savePrefs(); renderSetup(); };
  $('#scBasic').onclick = () => { S.scope = 'basic'; savePrefs(); renderSetup(); };
  $('#scTrap').onclick = () => { S.scope = 'trap'; savePrefs(); renderSetup(); };
  $('#startBtn').onclick = () => startExam(S.sel.flatMap(scopedIds));
  $('#retryStored').onclick = () => startExam((store.read().wrong || []).filter((id) => Q[id]));
  $('#clearStored').onclick = () => { const v = store.read(); v.wrong = []; v.picks = {}; store.write(v); renderSetup(); };
  function storedEntries() {
    const v = store.read(), picks = v.picks || {};
    return (v.wrong || []).filter((id) => Q[id]).sort().map((id) => ({ id, mine: id in picks ? picks[id] : null }));
  }
  function storedMd() {
    const es = storedEntries();
    return wrongMd(es, [`이 브라우저에 쌓인 누적 오답 ${es.length}문항 (맞히면 목록에서 빠짐)`]);
  }
  $('#saveStored').onclick = () => saveMd(storedMd(), 'Django_누적오답노트_' + stamp(true) + '.md', $('#storedMsg'));
  $('#copyStored').onclick = () => copyMd(storedMd(), $('#storedMsg'), $('#storedFallback'));
  function savePrefs() { const v = store.read(); v.prefs = { mode: S.mode, shuffle: S.shuffle, sel: S.sel, scope: S.scope }; store.write(v); }

  function startExam(ids) {
    if (!ids.length) return;
    const order = [...ids];
    if (S.shuffle) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
    Object.assign(S, { order, ans: {}, rev: {}, cur: 0, t0: Date.now(), elapsed: 0, confirm: false, sheet: false, filter: 'wrong' });
    show('exam'); renderExam(true);
  }

  // ---------- 시험 화면 ----------
  function answeredCount() { return S.order.filter((id) => S.ans[id]).length; }
  function renderExam(scrollOmr) {
    const id = S.order[S.cur], q = Q[id], total = S.order.length, practice = S.mode === 'practice';
    const revealed = practice && S.rev[id];
    $('#modePill').textContent = practice ? '연습 모드' : '시험 모드';
    $('#progText').textContent = `문항 ${S.cur + 1} / ${total}`;
    $('#answeredText').textContent = `${answeredCount()}개 답함`;
    $('#progFill').style.width = (answeredCount() / total * 100) + '%';
    $('#submitBtn').textContent = practice ? '결과 보기' : '제출';
    $('#qno').textContent = S.cur + 1;
    $('#qunit').innerHTML = esc(unitLabel(q.unit) + ' · ' + q.n + '번') + trapTag(q);
    $('#stem').innerHTML = block(q.stem);
    $('#choices').innerHTML = q.opts.map((o, i) => {
      const k = i + 1; let cls = '';
      if (revealed) { if (k === q.ans) cls = ' correct'; else if (k === S.ans[id]) cls = ' wrong'; }
      else if (S.ans[id] === k) cls = ' picked';
      return `<button type="button" class="opt${cls}" data-k="${k}"${revealed ? ' disabled' : ''} aria-pressed="${S.ans[id] === k}">
        <span class="bn">${k}</span><span class="tx">${inline(o)}</span></button>`;
    }).join('');
    if (revealed) {
      const ok = S.ans[id] === q.ans;
      $('#explainBox').innerHTML = `<div class="explain${ok ? '' : ' bad'}"><b>${ok ? '정답' : '오답'} · 정답 ${CIRC[q.ans - 1]}</b>${inline(q.exp)}</div>`;
    } else $('#explainBox').innerHTML = '';
    renderConfirm();
    $('#prevBtn').disabled = $('#mPrev').disabled = S.cur === 0;
    const last = S.cur === total - 1;
    $('#nextBtn').textContent = $('#mNext').textContent = last ? (practice ? '결과 보기' : '제출') : '다음 →';
    renderOmr(scrollOmr);
  }
  function renderConfirm() {
    if (!S.confirm) { $('#confirmBox').innerHTML = ''; return; }
    const left = S.order.length - answeredCount();
    $('#confirmBox').innerHTML = `<div class="confirm"><p>${left ? `안 푼 문제가 <b>${left}개</b> 있어. 그대로 제출할까?` : '모든 문제에 답했어. 제출할까?'}</p>
      <button class="btn" type="button" data-act="cancel">계속 풀기</button>
      ${left ? '<button class="btn" type="button" data-act="first">안 푼 문제로</button>' : ''}
      <button class="btn btn-primary" type="button" data-act="submit">제출하기</button></div>`;
  }
  function renderOmr(scroll) {
    const practice = S.mode === 'practice';
    let html = '', prevUnit = null;
    S.order.forEach((id, i) => {
      const q = Q[id];
      if (!S.shuffle && q.unit !== prevUnit) { html += `<div class="unit-sep">${esc(unitLabel(q.unit))}</div>`; prevUnit = q.unit; }
      const rev = practice && S.rev[id];
      const b = [1, 2, 3, 4].map((k) => {
        let c = '';
        if (rev) { if (k === S.ans[id]) c = k === q.ans ? ' ok' : ' no'; else if (k === q.ans) c = ' ans'; }
        else if (S.ans[id] === k) c = ' f';
        return `<button type="button" class="bub${c}" data-i="${i}" data-k="${k}" aria-label="${i + 1}번 ${k}번 보기"${rev ? ' disabled' : ''}>${k}</button>`;
      }).join('');
      html += `<div class="orow${i === S.cur ? ' cur' : ''}" id="or${i}"><button type="button" class="on" data-i="${i}">${i + 1}</button>${b}</div>`;
    });
    $('#omrBody').innerHTML = html;
    $('#omrLeft').textContent = `안 푼 문제 ${S.order.length - answeredCount()}`;
    if (scroll) { const r = document.getElementById('or' + S.cur); if (r) r.scrollIntoView({ block: 'nearest' }); }
  }
  function pick(k, idx = S.cur) {
    const id = S.order[idx];
    if (S.mode === 'practice' && S.rev[id]) return;
    S.ans[id] = k;
    if (S.mode === 'practice') S.rev[id] = true;
    S.cur = idx; S.confirm = false; renderExam(true);
  }
  function go(i) {
    if (i < 0) return;
    if (i >= S.order.length) { S.confirm = S.mode === 'exam'; if (S.mode === 'practice') return finish(); renderExam(); $('#confirmBox').scrollIntoView({ block: 'nearest' }); return; }
    S.cur = i; S.confirm = false; renderExam(true);
    if (window.innerWidth < 900) window.scrollTo(0, 0);
  }
  $('#choices').addEventListener('click', (e) => { const b = e.target.closest('.opt'); if (b) pick(+b.dataset.k); });
  $('#omrBody').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const i = +b.dataset.i;
    if (b.classList.contains('bub')) pick(+b.dataset.k, i); else go(i);
    if (b.classList.contains('on')) closeSheet();
  });
  $('#prevBtn').onclick = $('#mPrev').onclick = () => go(S.cur - 1);
  $('#nextBtn').onclick = $('#mNext').onclick = () => go(S.cur + 1);
  $('#submitBtn').onclick = () => { if (S.mode === 'practice') return finish(); S.confirm = true; renderConfirm(); $('#confirmBox').scrollIntoView({ block: 'nearest' }); };
  $('#confirmBox').addEventListener('click', (e) => {
    const a = e.target.closest('button')?.dataset.act; if (!a) return;
    if (a === 'cancel') { S.confirm = false; renderConfirm(); }
    if (a === 'first') { const i = S.order.findIndex((id) => !S.ans[id]); go(i); }
    if (a === 'submit') finish();
  });
  const openSheet = () => { S.sheet = true; $('#omr').classList.add('open'); $('#scrim').hidden = false; const r = document.getElementById('or' + S.cur); if (r) r.scrollIntoView({ block: 'center' }); };
  const closeSheet = () => { S.sheet = false; $('#omr').classList.remove('open'); $('#scrim').hidden = true; };
  $('#mSheet').onclick = openSheet; $('#omrClose').onclick = closeSheet; $('#scrim').onclick = closeSheet;
  document.addEventListener('keydown', (e) => {
    if (S.screen !== 'exam' || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest('input, textarea')) return;
    if (['1', '2', '3', '4'].includes(e.key)) { pick(+e.key); e.preventDefault(); }
    else if (e.key === 'ArrowRight' || e.key === 'Enter') { if (e.target.closest('button') && e.key === 'Enter') return; go(S.cur + 1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { go(S.cur - 1); e.preventDefault(); }
    else if (e.key === 'Escape') closeSheet();
  });
  setInterval(() => { if (S.screen === 'exam') { S.elapsed = Math.floor((Date.now() - S.t0) / 1000); $('#timer').textContent = fmt(S.elapsed); } }, 1000);

  // ---------- 결과 ----------
  function finish() {
    S.elapsed = Math.floor((Date.now() - S.t0) / 1000);
    const v = store.read(); const wrong = new Set(v.wrong || []); const picks = v.picks || {};
    for (const id of S.order) {
      if (S.ans[id] === Q[id].ans) { wrong.delete(id); delete picks[id]; }
      else { wrong.add(id); picks[id] = S.ans[id] || 0; }
    }
    v.wrong = [...wrong]; v.picks = picks; store.write(v);
    S.doneAt = stamp();
    closeSheet(); show('result'); renderResult();
  }
  function renderResult() {
    const total = S.order.length, right = S.order.filter((id) => S.ans[id] === Q[id].ans).length;
    const blank = S.order.filter((id) => !S.ans[id]).length, pct = Math.round(right / total * 100);
    $('#scoreBig').innerHTML = `${pct}<small>점</small>`;
    const v = $('#verdict'); v.className = 'verdict ' + (pct >= 60 ? 'pass' : 'fail'); v.textContent = pct >= 60 ? '60점 이상' : '60점 미만';
    $('#scoreLine').textContent = `${total}문항 중 ${right}개 정답 · ${total - right - blank}개 오답 · ${blank}개 안 품`;
    $('#scoreMeta').textContent = `${S.mode === 'practice' ? '연습 모드' : '시험 모드'} · 걸린 시간 ${fmt(S.elapsed)} · 문항당 ${fmt(Math.round(S.elapsed / total))}`;
    const per = {};
    for (const id of S.order) { const u = Q[id].unit; per[u] = per[u] || { t: 0, r: 0 }; per[u].t++; if (S.ans[id] === Q[id].ans) per[u].r++; }
    $('#utable').innerHTML = '<tr><th>단원</th><th>정답</th><th style="width:40%">정답률</th></tr>' +
      Object.keys(per).sort().map((u) => { const p = Math.round(per[u].r / per[u].t * 100);
        return `<tr><td>${esc(unitLabel(u))}</td><td class="n">${per[u].r} / ${per[u].t}</td><td><div style="display:flex;gap:8px;align-items:center"><div class="mini" style="flex:1"><i class="${p < 60 ? 'low' : ''}" style="width:${p}%"></i></div><span class="n tnum">${p}%</span></div></td></tr>`; }).join('');
    $('#fWrong').setAttribute('aria-pressed', S.filter === 'wrong'); $('#fAll').setAttribute('aria-pressed', S.filter === 'all');
    const wrongIds = S.order.filter((id) => S.ans[id] !== Q[id].ans);
    $('#retryWrong').hidden = !wrongIds.length;
    $('#exportPanel').hidden = !wrongIds.length;
    $('#exportInfo').textContent = `틀린 문제 ${wrongIds.length}개를 보기·내 답·정답·해설과 함께 마크다운으로`;
    $('#saveWrong').hidden = !DL;
    const list = S.filter === 'wrong' ? wrongIds : S.order;
    $('#review').innerHTML = list.length ? list.map((id) => {
      const q = Q[id], mine = S.ans[id], ok = mine === q.ans, i = S.order.indexOf(id);
      const opts = q.opts.map((o, j) => { const k = j + 1; let cls = '', tag = '';
        if (k === q.ans) { cls = ' correct'; tag = '<span class="tag right">정답</span>'; }
        if (k === mine && !ok) { cls = ' wrong'; tag = '<span class="tag mine">내 답</span>'; }
        return `<div class="opt${cls}"><span class="bn">${k}</span><span class="tx">${inline(o)}${tag}</span></div>`; }).join('');
      return `<article class="ritem ${ok ? 'good' : 'bad'}"><div class="rhead"><b>${i + 1}번</b><span>${esc(unitLabel(q.unit))} · ${q.n}번${trapTag(q)}</span><span>${ok ? '정답' : mine ? '오답' : '안 품'}</span></div>
        <div class="stem">${block(q.stem)}</div><div class="choices">${opts}</div>
        <div class="explain${ok ? '' : ' bad'}"><b>해설</b>${inline(q.exp)}</div></article>`;
    }).join('') : '<div class="empty">틀린 문제가 없어. 전부 맞혔다.</div>';
  }
  // ---------- 오답노트 내보내기 ----------
  let DL = null;
  function rerenderForDL() { if (S.screen === 'setup') renderSetup(); else if (S.screen === 'result') renderResult(); }
  try { window.claude?.use?.('downloads')?.then((d) => { DL = d || null; rerenderForDL(); }, () => {}); } catch {}
  const pad = (n) => String(n).padStart(2, '0');
  function stamp(compact) {
    const d = new Date(), date = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`, time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    return compact ? (date + '_' + time).replace(/[-:]/g, '') : date + ' ' + time;
  }
  function wrongMd(entries, headLines) {
    const out = [`# Django CBT 오답노트 — ${stamp()}`, '', ...headLines.map((l) => '> ' + l), ''];
    let unit = null, k = 0;
    for (const { id, mine } of entries) {
      const q = Q[id];
      if (q.unit !== unit) { unit = q.unit; out.push(`## ${unit}단원 · ${UNIT[unit].title}`, ''); }
      k++;
      const lines = q.stem.split('\n');
      out.push(`### ${k}. [${q.n}번${q.trap ? ' · 함정' : ''}] ${lines[0]}`);
      if (lines.length > 1) out.push('', ...lines.slice(1));
      out.push('');
      q.opts.forEach((o, j) => {
        const n = j + 1, mark = n === q.ans ? ' ✅ 정답' : n === mine ? ' ❌ 내 답' : '';
        out.push(`- ${CIRC[j]} ${o}${mark}`);
      });
      if (mine === null) out.push('- (내 답 기록 없음)');
      else if (!mine) out.push('- (안 품)');
      out.push('', `> **해설** ${q.exp}`, '', '---', '');
    }
    return out.join('\n');
  }
  function resultMd() {
    const total = S.order.length, right = S.order.filter((id) => S.ans[id] === Q[id].ans).length;
    const entries = S.order.filter((id) => S.ans[id] !== Q[id].ans).map((id) => ({ id, mine: S.ans[id] || 0 }))
      .sort((a, b) => a.id.localeCompare(b.id));
    const per = {};
    for (const id of S.order) { const u = Q[id].unit; per[u] = per[u] || { t: 0, r: 0 }; per[u].t++; if (S.ans[id] === Q[id].ans) per[u].r++; }
    const head = [
      `${S.mode === 'practice' ? '연습' : '시험'} 모드 · ${total}문항 중 ${right}개 정답 (${Math.round(right / total * 100)}점) · 걸린 시간 ${fmt(S.elapsed)}`,
      '',
      '| 단원 | 정답 | 정답률 |',
      '|---|---|---|',
      ...Object.keys(per).sort().map((u) => `| ${u} ${UNIT[u].title} | ${per[u].r} / ${per[u].t} | ${Math.round(per[u].r / per[u].t * 100)}% |`),
    ];
    return wrongMd(entries, head);
  }
  async function saveMd(text, filename, msgEl) {
    if (!DL) return;
    try {
      await DL.save({ filename, data: text });
      msgEl.textContent = '오답노트 파일을 저장했어.';
    } catch (e) {
      const c = e && e.code;
      if (c === 'declined') msgEl.textContent = '저장을 취소했어.';
      else if (c === 'rate_limited') msgEl.textContent = '저장 창이 이미 열려 있어. 잠시 후 다시 눌러 줘.';
      else { DL = null; rerenderForDL(); msgEl.textContent = '이 화면에서는 파일 저장을 쓸 수 없어. 마크다운 복사를 써 줘.'; }
    }
  }
  async function copyMd(text, msgEl, fbEl) {
    try {
      await navigator.clipboard.writeText(text);
      fbEl.hidden = true;
      msgEl.textContent = '마크다운을 복사했어. 오답노트 파일에 붙여 넣으면 돼.';
    } catch {
      fbEl.value = text; fbEl.hidden = false; fbEl.focus(); fbEl.select();
      msgEl.textContent = '이 화면에서는 자동 복사가 막혀 있어. 아래 내용이 선택되어 있으니 직접 복사해 줘.';
    }
  }
  $('#saveWrong').onclick = () => saveMd(resultMd(), 'Django_오답노트_' + stamp(true) + '.md', $('#exportMsg'));
  $('#copyWrong').onclick = () => copyMd(resultMd(), $('#exportMsg'), $('#exportFallback'));

  $('#fWrong').onclick = () => { S.filter = 'wrong'; renderResult(); };
  $('#fAll').onclick = () => { S.filter = 'all'; renderResult(); };
  $('#retryWrong').onclick = () => startExam(S.order.filter((id) => S.ans[id] !== Q[id].ans));
  $('#toSetup').onclick = () => { show('setup'); renderSetup(); };

  // ---------- 부팅 / 핫리로드 ----------
  function boot(data) {
    const prefs = store.read().prefs;
    if (prefs) {
      S.mode = prefs.mode || S.mode; S.shuffle = !!prefs.shuffle;
      if (Array.isArray(prefs.sel)) S.sel = prefs.sel.filter((u) => UNIT[u]);
      if (['all', 'basic', 'trap'].includes(prefs.scope)) S.scope = prefs.scope;
    }
    if (data && data.S && Array.isArray(data.S.order)) { S = { ...S, ...data.S, order: data.S.order.filter((id) => Q[id]) }; }
    renderSetup();
    if (S.screen === 'exam' && S.order.length) { S.t0 = Date.now() - S.elapsed * 1000; show('exam'); renderExam(true); }
    else if (S.screen === 'result' && S.order.length) { show('result'); renderResult(); }
    else show('setup');
  }
  try { window.claude?.hot?.snapshot?.(() => ({ S: { ...S, sheet: false } })); } catch {}
  const h = window.claude?.hot;
  if (h?.ready) h.ready(boot); else boot(h?.data ?? {});
})();
</script>
